<!doctype html>
<html><head><meta charset="utf-8"><title>WO Results</title>
<style>
  html{overflow-anchor:none}  /* scroll position is kept manually (see render) */
  body{font:14px system-ui,sans-serif;margin:20px;background:#fff}
  h3{margin:0 0 10px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
  select{max-width:640px;padding:4px}
  button{padding:4px 10px;cursor:pointer}
  #status{margin:6px 0;color:#444}
  #lists{margin:2px 0 8px;color:#666;font-size:12px}
  #toolbar{position:sticky;top:0;z-index:30;background:#fff;margin:0 -20px;padding:6px 20px;border-bottom:1px solid #ccc;box-shadow:0 2px 4px rgba(0,0,0,.08)}
  #toolbar .bar{margin:0}
  table{border-collapse:collapse;margin:12px 0}
  thead th{position:sticky;top:var(--tbh,48px);z-index:20;box-shadow:0 1px 0 #ccc,0 -1px 0 #ccc}
  td,th{border:1px solid #ccc;padding:4px 10px;text-align:left;vertical-align:top}
  th{background:#f3f3f3}
  tr.TRUE td.res{background:#d4f4d4}
  tr.FALSE td.res{background:#eee}
  tr.FALSEEEEEE td.res{background:#ffd6d6;font-weight:bold}
  tr.UNSURE td.res{background:#fff0d6;font-weight:bold}
  tr.ERROR td.res{background:#eee}
  tr.queued td{color:#999}
  tr.checking td{color:#06c}
  .dots::after{content:"...";animation:b 1s steps(4,end) infinite}
  @keyframes b{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
  td.note{font-size:12px;max-width:420px;color:#444}
  .snip{border:1px solid #ddd;background:#fff;padding:4px;margin-top:5px;max-width:520px;max-height:160px;overflow:auto;font-size:12px;color:#000}
  .when{color:#666;font-size:12px}
  tr.sec td{background:#eef1f6;font-weight:600;border-left:0;border-right:0}
  td.chip{text-align:center;font-weight:600;min-width:70px}
  td.why{font-size:12px;max-width:520px;color:#333}
  .hot{font-weight:700}
  label{margin-left:4px}
  .snipbtn{margin-top:4px;padding:1px 6px;font-size:11px}
</style></head>
<body>
  <h3>Results</h3>
  <div class="bar">
    <label for="runSel">Run:</label>
    <select id="runSel"></select>
    <button id="del">Delete this run</button>
    <label id="viewWrap" hidden>View: <select id="view"><option value="diff">Changes vs file</option><option value="all">All results</option></select></label>
  </div>
  <div id="status">Loading...</div>
  <div id="lists"></div>
  <div id="toolbar"><div class="bar">
    <span id="allBtns"><button id="copy">Copy (WO + result)</button> <button id="copyAll">Copy all columns</button></span>
    <span id="diffBtns" hidden>
      <button id="copyG" title="WO numbers whose cell should turn green">Copy WOs &rarr; green</button>
      <button id="copyR" title="WO numbers whose cell should turn red">Copy WOs &rarr; red</button>
      <button id="copyRep">Copy report</button>
      <button id="recheck" title="Look up only the WOs listed below again (ServiceChannel / Dollar Tree and Salesforce), e.g. after a case was updated">Re-check these rows</button>
      <label title="Salesforce with several cases: OK if any one case is in a done status. Used by Re-check."><input type="checkbox" id="anydone" checked> Multi-case: any done is OK</label>
      <button id="recmp" title="Load a fresher download of the sheet and compare again (no re-check needed)">Re-compare with newer file...</button>
      <input type="file" id="recmpFile" accept=".xlsx" hidden>
    </span>
    <button id="csv">Download CSV</button>
    <span id="toggles">
      <label><input type="checkbox" id="simple"> <b>Simple view</b> (hide snippet buttons and notes)</label>
      <label><input type="checkbox" id="snips"> Show ALL page snippets (slow with many rows; or use the button on a row)</label>
      <label><input type="checkbox" id="details"> Show details (notes)</label>
    </span>
    <span id="ok"></span>
  </div></div>
  <table id="t"></table>
  <script src="settings.js"></script>
  <script src="runs.js"></script>
  <script src="xlsx.js"></script>
  <script src="results.js"></script>
</body></html>
